<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 ماينكرافت ويب - اللعب</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        #hud {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: Arial, sans-serif;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 10px;
            display: flex;
            gap: 20px;
            pointer-events: none;
        }
        #health, #hunger, #level {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #inventory {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            background: rgba(0,0,0,0.5);
            padding: 5px;
            border-radius: 5px;
        }
        .slot {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }
        .slot.active {
            border-color: #ff0;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 30px;
            pointer-events: none;
            opacity: 0.5;
        }
        #chat {
            position: absolute;
            bottom: 150px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            width: 300px;
        }
        #chatInput {
            position: absolute;
            bottom: 120px;
            left: 20px;
            width: 280px;
            padding: 5px;
            border: none;
            border-radius: 3px;
            background: rgba(0,0,0,0.7);
            color: white;
            display: none;
        }
    </style>
</head>
<body>
    <div id="crosshair">+</div>
    <div id="hud">
        <div id="health">❤️ <span id="healthVal">20</span></div>
        <div id="hunger">🍖 <span id="hungerVal">20</span></div>
        <div id="level">⬆️ <span id="levelVal">0</span></div>
    </div>
    <div id="inventory"></div>
    <div id="chat"></div>
    <input type="text" id="chatInput" placeholder="اكتب رسالة...">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="config.js"></script>
    <script src="blocks.js"></script>
    <script src="entities.js"></script>
    <script src="world.js"></script>
    <script src="player.js"></script>
    <script src="inventory.js"></script>
    <script src="crafting.js"></script>
    <script src="lighting.js"></script>
    <script src="multiplayer.js"></script>
    <script src="textures.js"></script>
    <script src="sounds.js"></script>
    <script src="utils.js"></script>
    <script src="script.js"></script>
</body>
</html>
